schema_version: "1.0"

# PROVA DE CONCEITO (draft). Necessidade textual — o tema discriminante está no
# conteúdo (ASSUNTO/ACORDAO), não em metadados.
# Alvo documental de origem: doc_id tcu-5567c745c20f (ACORDAO-COMPLETO; Acórdão 16/2024 - Plenário).
need_id: "NI-002"

description: >-
  Qual acórdão do TCU — indicando o número e o colegiado — tratou de denúncia
  sobre possíveis irregularidades na aplicação de recursos federais da educação
  no Estado de Pernambuco que abordasse, conjuntamente, a alegada falta de
  merenda nas escolas e a manutenção de contratos temporários de professores?

nature: "textual"

scope:
  corpus: "tcu-acordaos-completo-2024-v1"
  temporal: "2024"
  selection_fingerprint: "ec125709322854d164e8f4aeaffb0351ef92e0adfede4d92b17b955b5ea1bc5c"

mandatory_conditions:
  - description: >-
      O conteúdo do documento trata de denúncia sobre POSSÍVEIS irregularidades na
      aplicação de recursos federais da educação no Estado de Pernambuco e aborda,
      de forma CONJUNTA (ambos os subtemas no mesmo caso documental): (1) a alegada
      falta de merenda nas escolas; e (2) a contratação ou manutenção de contratos
      temporários de professores. Documento que trate de apenas um dos subtemas
      NÃO é pertinente. Evidência no ASSUNTO e/ou ACORDAO.
    relates_to: "textual"

requested_facts:
  - "Número do acórdão."
  - "Colegiado do TCU."

operations:
  - "identify"

# Cardinalidade esperada da resposta: documento único (identificação).
answer_cardinality: "single"

# Evidência textual que caracteriza relevância. O tema discriminante está no
# conteúdo (ASSUNTO/ACORDAO), não em metadados. A relevância exige a CONJUNÇÃO
# dos dois subtemas no mesmo caso documental; documento que trate de apenas um
# deles NÃO é relevante. "Contratação" e "manutenção" de contratos temporários
# de professores contam igualmente para esse subtema.
required_textual_evidence:
  - >-
    O conteúdo trata de denúncia sobre possíveis irregularidades na aplicação
    de recursos federais da educação no Estado de Pernambuco.
  - >-
    O mesmo caso aborda, de forma CONJUNTA, os dois subtemas: (1) a alegada
    falta de merenda nas escolas; e (2) a contratação ou a manutenção de
    contratos temporários de professores. A presença de apenas um dos subtemas
    não caracteriza relevância.

formulations:
  direct: >-
    Qual acórdão do TCU tratou da denúncia sobre possíveis irregularidades em
    recursos federais da educação em Pernambuco que envolvia, ao mesmo tempo, a
    alegada falta de merenda escolar e a manutenção de contratos temporários de
    professores? Informe o número e o colegiado.
  paraphrase: >-
    Que acórdão do TCU cuidou da denúncia a respeito de supostas irregularidades
    em verbas federais de educação no Estado de Pernambuco que reunia, no mesmo
    caso, a alegada ausência de merenda nas escolas e a continuidade de contratos
    temporários de professores? Indique o número do acórdão e o colegiado.
  verbose: >-
    Houve uma denúncia no Tribunal de Contas da União a respeito de possíveis
    irregularidades na aplicação de recursos federais destinados à educação no
    Estado de Pernambuco. Essa denúncia tratava, conjuntamente, da alegada falta
    de merenda nas escolas e da manutenção de contratos temporários de
    professores. Qual foi o número do acórdão que apreciou esse caso e em qual
    colegiado ele foi proferido?

equivalence_validation:
  # Validada por revisão humana (Vitoria Novaes da Costa). A conferência factual
  # do documento de origem tcu-5567c745c20f (Acórdão 16/2024 - Plenário) foi
  # concluída. A paráfrase foi ajustada de "contratação temporária de
  # professores" para "continuidade de contratos temporários de professores",
  # alinhando-a ao termo factual da fonte ("manutenção de contratos temporários").
  status: "validated"
  rationale: >-
    Natureza: necessidade TEXTUAL — o tema discriminante reside no conteúdo
    (ASSUNTO/ACORDAO) e não em metadados; não há condição estrutural obrigatória.
    Evidência necessária: o documento deve tratar da denúncia sobre recursos
    federais da educação em Pernambuco e abordar, CONJUNTAMENTE, a alegada falta
    de merenda e a manutenção/contratação de professores temporários — a
    presença de um só subtema não caracteriza relevância. Relevância para a
    comparação das arquiteturas: é um caso de documento único cuja discriminação
    depende de evidência textual composta (dois subtemas no mesmo caso), útil
    para observar como a recuperação vetorial/híbrida lida com conjunção
    semântica que a recuperação estruturada não expressa — sem presumir
    superioridade de qualquer abordagem. Equivalência das três formulações:
    direta, parafraseada e prolixa pedem os mesmos dois fatos (número do acórdão
    e colegiado) e preservam a conjunção obrigatória dos dois subtemas; a prolixa
    é mais extensa porém não adiciona fato novo nem pista da resposta, e nenhuma
    formulação introduz restrição ausente nas demais.
  reviewers:
    - id: "Vitoria Novaes da Costa"
      decision: "equivalent"
